[project]
name = "visai"
version = "0.1.0"
description = "Self-improving model and kernel optimization agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents[openai]>=1.0",
    "openai>=1.40",
    "pymongo>=4.8",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "mlx>=0.20",
    "mlx-lm>=0.20",
    "datasets>=2.20",
]

[project.optional-dependencies]
asr = ["jiwer>=3.0", "parakeet-mlx>=0.5", "mlx-audio>=0.5", "soundfile>=0.12", "coremltools>=8.0"]
cuda = ["modal>=0.64"]

[project.scripts]
visai = "visai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visai"]

[tool.ruff]
line-length = 110
